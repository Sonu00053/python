<!DOCTYPE html>
<html>
<head>

<title>{{ APP_NAME }} | Chat</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#ece5dd;
}

.chat-container{
max-width:600px;
margin:auto;
height:90vh;
display:flex;
flex-direction:column;
margin-top:20px;
}

.chat-header{
background:#075E54;
color:white;
padding:15px;
font-weight:bold;
}

.chat-box{
flex:1;
overflow-y:auto;
padding:20px;
background:#efeae2;
scroll-behavior:auto;
}

.message{
max-width:70%;
padding:10px 15px;
border-radius:10px;
margin-bottom:10px;
}

.sent{
background:#d9fdd3;
margin-left:auto;
}

.received{
background:white;
}

.time{
font-size:11px;
display:block;
margin-top:3px;
text-align:right;
color:#555;
}

.chat-input{
background:white;
padding:10px;
display:flex;
gap:10px;
}

</style>

</head>

<body>

<div class="chat-container shadow">

<div class="chat-header">
{{ user.sender_id }}
</div>

<div class="chat-box" id="chatBox">

{% for msg in messages %}

    {% if msg.sender_id == session["user_id"] %}

        <div class="message sent">
            {{ msg.message }}
            <span class="time">{{ msg.date }}</span>
        </div>

    {% else %}

        <div class="message received">
            {{ msg.message }}
            <span class="time">{{ msg.date }}</span>
        </div>

    {% endif %}

{% endfor %}

</div>


<form method="POST">

<div class="chat-input">

<input
type="text"
name="message"
class="form-control"
placeholder="Type a message"
required
autocomplete="off"
>

<button class="btn btn-success">
Send
</button>

</div>

</form>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

let chatBox = document.getElementById("chatBox");

chatBox.scrollTop = chatBox.scrollHeight;

});

</script>

</body>
</html>
